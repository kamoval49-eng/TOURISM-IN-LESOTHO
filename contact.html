<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <p>Plan your Lesotho adventure.</p>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark site-nav">
        <div class="container">
            <a class="navbar-brand" href="index.html">Discover Lesotho</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <button id="themeButton" class="btn btn-success" type="button">Dark Mode</button>

        <section>
            <h2>Booking Enquiry</h2>
            <form id="bookingForm">
                <label for="visitor">Full Name</label>
                <input class="form-control" type="text" id="visitor" required>

                <label for="bookingEmail">Email Address</label>
                <input class="form-control" type="email" id="bookingEmail" required>

                <label for="visitDate">Date of Visit</label>
                <input class="form-control" type="date" id="visitDate" required>

                <label for="visitors">Number of Visitors</label>
                <input class="form-control" type="number" id="visitors" min="1" required>

                <button class="btn btn-success" type="submit">Send Booking Enquiry</button>
            </form>
            <p id="bookingMessage" aria-live="polite"></p>
        </section>

        <section>
            <h2>Send Us a Message</h2>
            <form id="contactForm">
                <label for="contactName">Your Name</label>
                <input class="form-control" type="text" id="contactName" required>

                <label for="contactEmail">Your Email</label>
                <input class="form-control" type="email" id="contactEmail" required>

                <label for="message">Your Message</label>
                <textarea class="form-control" id="message" required></textarea>

                <button class="btn btn-success" type="submit">Send Message</button>
            </form>
            <p id="contactMessage" aria-live="polite"></p>
        </section>
    </main>

    <footer>Discover Lesotho Tourism &copy; 2026</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
